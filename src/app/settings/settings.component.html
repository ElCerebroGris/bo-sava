<div class="app-shell min-h-screen bg-[#f7f8f4] text-[#24322d]">
  <app-sidebar />
  <main class="main-panel min-h-screen">
    <header
      class="topbar flex items-center justify-between border-b border-[#e9ece6] bg-white/80 px-8 py-4"
    >
      <div class="flex items-center gap-3 text-[13px] text-[#86918b]">
        <span>Gestão</span><span>/</span
        ><span class="font-medium text-[#24322d]">Definições</span>
      </div>
      <app-profile-menu />
    </header>
    <div class="page-content">
      <section class="mb-7">
        <div class="mb-2 text-xs font-medium text-[#859088]">
          Portal de parceiros
        </div>
        <h1 class="text-[29px] font-semibold tracking-[-.04em]">Definições</h1>
        <p class="mt-1 text-sm text-[#89948d]">
          Gira as preferências da sua conta e do portal.
        </p>
      </section>
      <section
        class="max-w-3xl rounded-2xl border border-[#e9ece6] bg-white p-6 md:p-8"
      >
        <h2 class="text-sm font-semibold">Perfil do parceiro</h2>
        <p class="mt-1 text-xs text-[#89948d]">
          Actualize os dados apresentados na sua conta.
        </p>
        <div class="mt-5 grid gap-5 sm:grid-cols-2">
          <label class="field"
            >Nome<input [(ngModel)]="settings.name" name="name" /></label
          ><label class="field"
            >E-mail<input
              type="email"
              [(ngModel)]="settings.email"
              name="email" /></label
          ><label class="field"
            >Idioma<select [(ngModel)]="settings.language" name="language">
              <option>Português</option>
              <option>English</option>
            </select></label
          >
        </div>
        <div class="mt-7 border-t border-[#eef0ec] pt-6">
          <h2 class="text-sm font-semibold">Notificações</h2>
          <label class="setting-toggle"
            ><span
              ><strong>Novas reservas</strong
              ><small
                >Receber actualizações sobre pedidos e estadias.</small
              ></span
            ><input
              type="checkbox"
              [(ngModel)]="settings.bookingNotifications"
              name="bookingNotifications" /></label
          ><label class="setting-toggle"
            ><span
              ><strong>Pagamentos</strong
              ><small
                >Receber actualizações sobre movimentos e pagamentos.</small
              ></span
            ><input
              type="checkbox"
              [(ngModel)]="settings.paymentNotifications"
              name="paymentNotifications"
          /></label>
        </div>
        <div class="mt-6 flex justify-end border-t border-[#eef0ec] pt-5">
          <button type="button" (click)="saveSettings()" class="save-button">
            Guardar definições
          </button>
        </div>
      </section>
      <footer class="py-6 text-center text-[10px] text-[#a2aaa4]">
        Portal de Parceiros Sava · Feito para Angola
      </footer>
    </div>
  </main>
</div>
@if (notice) {
  <div
    role="status"
    class="fixed bottom-5 right-5 z-50 rounded-xl bg-[#203a32] px-4 py-3 text-xs font-medium text-white shadow-xl"
  >
    {{ notice }}
  </div>
}
